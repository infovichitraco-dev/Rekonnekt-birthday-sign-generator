<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Birthday Sign Generator</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Imperial+Script&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Playfair Display", serif;
      background:
        radial-gradient(circle at top left, #e8f6ff, transparent 30%),
        radial-gradient(circle at bottom right, #fff1f7, transparent 35%),
        #ffffff;
      color: #4e4e68;
    }

    .app {
      width: min(1100px, 92vw);
      margin: auto;
      padding: 40px 0;
      display: grid;
      gap: 28px;
    }

    .card {
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid #d7ecff;
      border-radius: 28px;
      padding: 34px;
      box-shadow: 0 20px 60px rgba(122, 167, 210, 0.18);
    }

    .logo-area {
      text-align: center;
      margin-bottom: 28px;
    }

    .logo-area h1 {
      margin: 12px 0 8px;
      font-size: clamp(28px, 5vw, 46px);
      color: #8b7bb8;
    }

    .logo-area p {
      margin: 0;
      color: #8d8da3;
    }

    .rainbow {
      width: 180px;
      height: 90px;
      margin: auto;
      border-radius: 180px 180px 0 0;
      background: linear-gradient(
        to bottom,
        #ffb7d5 0 20%,
        #ffe18a 20% 40%,
        #b9efd5 40% 60%,
        #aee4ff 60% 80%,
        #d8c5ff 80% 100%
      );
      opacity: 0.9;
    }

    form {
      display: grid;
      gap: 18px;
    }

    label {
      display: grid;
      gap: 8px;
      font-size: 16px;
    }

    input,
    select {
      width: 100%;
      padding: 15px 16px;
      border-radius: 16px;
      border: 1px solid #cbdff5;
      font-size: 16px;
      background: #ffffff;
      color: #4e4e68;
      font-family: inherit;
    }

    button {
      border: 0;
      border-radius: 18px;
      padding: 15px 22px;
      cursor: pointer;
      font-size: 16px;
      font-weight: 600;
      background: #8bc7f5;
      color: #ffffff;
      box-shadow: 0 10px 25px rgba(139, 199, 245, 0.35);
      font-family: inherit;
    }

    button:hover {
      opacity: 0.92;
    }

    .loader {
      margin-top: 24px;
    }

    .loader-text {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      color: #7b7b94;
    }

    .progress-track {
      width: 100%;
      height: 14px;
      border-radius: 999px;
      background: #edf6ff;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      background: linear-gradient(90deg, #8bc7f5, #d8c5ff, #ffb7d5);
      transition: width 0.2s ease;
    }

    .result {
      display: grid;
      gap: 20px;
      justify-items: center;
    }

    canvas {
      width: min(420px, 92vw);
      height: auto;
      border-radius: 18px;
      box-shadow: 0 18px 50px rgba(122, 167, 210, 0.2);
      background: white;
    }

    .actions {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .note {
      text-align: center;
      color: #8d8da3;
      font-size: 14px;
      line-height: 1.6;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>
  <main class="app">
    <section class="card">
      <div class="logo-area">
        <div class="rainbow"></div>
        <h1>Birthday Sign Generator</h1>
        <p>Create a personalised birthday sunboard design</p>
      </div>

      <form id="generatorForm">
        <label>
          Child Name
          <input id="childName" type="text" placeholder="Enter name" required />
        </label>

        <label>
          Gender
          <select id="gender" required>
            <option value="">Select gender</option>
            <option value="girl">Girl</option>
            <option value="boy">Boy</option>
          </select>
        </label>

        <button type="submit">Create Design</button>
      </form>

      <div id="loader" class="loader hidden">
        <div class="loader-text">
          <span>Generating design</span>
          <span id="progressText">0%</span>
        </div>
        <div class="progress-track">
          <div id="progressBar" class="progress-bar"></div>
        </div>
      </div>
    </section>

    <section id="resultSection" class="result hidden">
      <canvas id="previewCanvas"></canvas>

      <div class="actions">
        <button id="downloadPng">Download PNG</button>
        <button id="downloadPdf">Download PDF</button>
      </div>

      <p class="note">
        Place your final blank templates inside an assets folder with these exact names:<br>
        girl-template.png and boy-template.png
      </p>
    </section>
  </main>

  <script>
    const form = document.getElementById("generatorForm");
    const childNameInput = document.getElementById("childName");
    const genderInput = document.getElementById("gender");

    const loader = document.getElementById("loader");
    const progressBar = document.getElementById("progressBar");
    const progressText = document.getElementById("progressText");

    const resultSection = document.getElementById("resultSection");
    const canvas = document.getElementById("previewCanvas");
    const ctx = canvas.getContext("2d");

    const downloadPngBtn = document.getElementById("downloadPng");
    const downloadPdfBtn = document.getElementById("downloadPdf");

    let finalImageData = null;

    const templates = {
      girl: "assets/girl-template.png",
      boy: "assets/boy-template.png"
    };

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      const name = childNameInput.value.trim();
      const gender = genderInput.value;

      if (!name || !gender) return;

      resultSection.classList.add("hidden");
      loader.classList.remove("hidden");
      progressBar.style.width = "0%";
      progressText.textContent = "0%";

      try {
        await fakeProgress();
        await createBirthdayImage(name, gender);

        loader.classList.add("hidden");
        resultSection.classList.remove("hidden");
      } catch (error) {
        loader.classList.add("hidden");
        alert("Could not load the template. Please check that the image files are inside the assets folder and named correctly.");
        console.error(error);
      }
    });

    function fakeProgress() {
      return new Promise(resolve => {
        let progress = 0;

        const interval = setInterval(() => {
          progress += Math.floor(Math.random() * 12) + 5;

          if (progress >= 100) {
            progress = 100;
            clearInterval(interval);
            setTimeout(resolve, 250);
          }

          progressBar.style.width = progress + "%";
          progressText.textContent = progress + "%";
        }, 160);
      });
    }

    function loadImage(src) {
      return new Promise((resolve, reject) => {
        const image = new Image();
        image.crossOrigin = "anonymous";
        image.onload = () => resolve(image);
        image.onerror = reject;
        image.src = src;
      });
    }

    async function createBirthdayImage(name, gender) {
      await document.fonts.ready;

      const template = await loadImage(templates[gender]);

      canvas.width = template.width;
      canvas.height = template.height;

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(template, 0, 0, canvas.width, canvas.height);

      const isGirl = gender === "girl";

      const fontSize = Math.round(canvas.width * 0.145);
      const nameY = Math.round(canvas.height * 0.545);
      const maxWidth = canvas.width * 0.78;

      ctx.save();

      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.font = `${fontSize}px "Imperial Script", "Great Vibes", cursive`;

      ctx.shadowColor = isGirl
        ? "rgba(255, 150, 190, 0.38)"
        : "rgba(80, 160, 230, 0.38)";

      ctx.shadowBlur = Math.round(canvas.width * 0.015);
      ctx.shadowOffsetY = Math.round(canvas.width * 0.006);

      ctx.fillStyle = isGirl ? "#f191bf" : "#6aaee8";

      fitText(ctx, name, canvas.width / 2, nameY, maxWidth, fontSize);

      ctx.restore();

      finalImageData = canvas.toDataURL("image/png");
    }

    function fitText(context, text, x, y, maxWidth, startingFontSize) {
      let fontSize = startingFontSize;

      while (context.measureText(text).width > maxWidth && fontSize > 40) {
        fontSize -= 4;
        context.font = `${fontSize}px "Imperial Script", "Great Vibes", cursive`;
      }

      context.fillText(text, x, y);
    }

    downloadPngBtn.addEventListener("click", function() {
      if (!finalImageData) return;

      const link = document.createElement("a");
      link.download = "birthday-sign.png";
      link.href = finalImageData;
      link.click();
    });

    downloadPdfBtn.addEventListener("click", function() {
      if (!finalImageData) return;

      const { jsPDF } = window.jspdf;

      const pdf = new jsPDF({
        orientation: "portrait",
        unit: "px",
        format: [canvas.width, canvas.height]
      });

      pdf.addImage(finalImageData, "PNG", 0, 0, canvas.width, canvas.height);
      pdf.save("birthday-sign.pdf");
    });
  </script>
</body>
</html>
